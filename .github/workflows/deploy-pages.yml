name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      # El sitio se publica en la URL de GitHub. El día que haya dominio
      # propio: fichero CNAME, variable de repositorio DOMINIO_PROPIO=1 y el
      # dominio en DOMINIO_URL. Ver README.
      BASE_PATH: ${{ vars.DOMINIO_PROPIO == '1' && '' || '/vivienda-publica-' }}
      SITIO_URL: ${{ vars.DOMINIO_PROPIO == '1' && vars.DOMINIO_URL || 'https://aldeapucela.github.io/vivienda-publica-' }}
      DOMINIO_PROPIO: ${{ vars.DOMINIO_PROPIO }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pruebas (parser + privacidad)
        run: npm test

      - name: Generar el sitio
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # activa Pages en el repo la primera vez, sin tocar Settings
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deploy
        uses: actions/deploy-pages@v4
