name: Actualizar datos

# Una vez al día: lee las fichas oficiales, saca los plazos de los boletines
# que enlazan, detecta lo que ha cambiado y publica. Los avisos salen por la
# propia web, por RSS y por calendario: no hay correo ni suscriptores.

on:
  schedule:
    # Dos pasadas al día. Con una bastaría para el ritmo al que publica la
    # fuente, pero GitHub retrasa y a veces se salta las ejecuciones
    # programadas: la segunda es el seguro de la primera.
    - cron: '30 6 * * *'    # ~08:30 en Valladolid
    - cron: '30 16 * * *'   # ~18:30 en Valladolid
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pruebas (parser, plazos, avisos, privacidad)
        run: npm test

      - name: Leer las fichas oficiales
        run: node scripts/sync.mjs

      - name: Extraer los plazos de los boletines oficiales
        run: node scripts/plazos.mjs

      - name: Detectar novedades y plazos que se acercan
        run: node scripts/avisos.mjs

      - name: Contexto de los municipios (datos abiertos de la JCyL)
        run: node scripts/contexto.mjs --actualizar

      - name: Test de privacidad
        run: node scripts/check-privacidad.mjs

      - name: Commitear si hay cambios
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- data/ fuentes/; then
            echo "sin cambios en data/ ni en fuentes/"
          else
            git add data/ fuentes/
            git commit -m "Actualizar datos ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Generar el sitio
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # activa Pages en el repo la primera vez, sin tocar Settings
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deploy
        uses: actions/deploy-pages@v4

      # Si algo se rompe (la fuente rediseña su web, el parseo devuelve
      # basura, la comprobación de privacidad salta), que no se quede en un
      # aspa dentro de la pestaña Actions: se abre una incidencia. Solo una
      # abierta a la vez, para no llenar el repositorio de duplicados.
      - name: Avisar si la actualización ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          abiertas=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues?state=open&labels=actualizacion-parada" \
            | grep -c '"number"' || true)
          if [ "$abiertas" != "0" ]; then
            echo "ya hay una incidencia abierta por esto"; exit 0
          fi
          cuerpo="La actualización automática de hoy ha fallado, así que la web sigue mostrando los datos anteriores.\n\nEjecución: $EJECUCION\n\nSospechosos habituales:\n- la fuente ha cambiado su web y el parseo ya no encuentra lo que buscaba (scripts/lib.mjs)\n- la comprobación de coherencia ha parado la escritura a propósito\n- la comprobación de privacidad ha encontrado algo que no debía publicarse\n\nMientras esto siga roto, la web avisa por sí sola: a los cuatro días sin comprobar, sale un aviso en la cabecera."
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues" \
            -d "$(printf '{"title":"La actualización automática ha fallado (%s)","labels":["actualizacion-parada"],"body":"%s"}' "$(date -u +%Y-%m-%d)" "$cuerpo")" \
            -o /dev/null -w 'incidencia creada: %{http_code}\n'
